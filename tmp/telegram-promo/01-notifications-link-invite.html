<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Уведомления — связывание</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f3f3f7;
      font-family: Nunito, system-ui, sans-serif;
      color: #1a1a22;
      padding: 28px 36px 40px;
    }
    .topRow { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    .title { margin: 0; font-size: 40px; font-weight: 800; }
    .subtitle { margin: 8px 0 0; opacity: 0.7; font-size: 16px; }
    .ctaRow { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    .pill {
      background: white; border: 2px solid #ddd; border-radius: 999px;
      padding: 10px 16px; font-weight: 700; font-size: 15px; color: #333;
    }
    .pill.purple { border-color: #4f3dff; color: #4f3dff; }
    .pill.blue { border-color: #2f6fed; color: #2f6fed; }
    .pill.green { border-color: #1f9d57; color: #1f9d57; }
    .pill.pink { border-color: #e2557a; color: #e2557a; }
    .pill.active { background: #4f3dff; color: white; border-color: #4f3dff; }
    .card {
      background: white; border-radius: 18px; padding: 20px 22px;
      box-shadow: 0 8px 28px rgba(40, 30, 90, 0.08);
    }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .btn {
      border: none; cursor: default; background: #4f3dff; color: white;
      border-radius: 999px; padding: 10px 16px; font-weight: 700; font-size: 15px;
      font-family: inherit;
    }
    .btn.secondary { background: white; color: #4f3dff; border: 2px solid #4f3dff; }
    .filterHint { opacity: 0.65; font-weight: 700; font-size: 14px; }
    .notifRow {
      display: flex; justify-content: space-between; gap: 20px; align-items: flex-start;
      padding: 16px; border-radius: 14px; background: #f7f6ff;
      border: 1px solid rgba(79, 61, 255, 0.18);
    }
    .notifRow.unread { box-shadow: inset 3px 0 0 #4f3dff; }
    .chip {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1.5px solid rgba(79,61,255,0.35); border-radius: 999px;
      padding: 4px 12px 4px 4px; background: white; font-weight: 700; font-size: 14px;
    }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
      background: #ddd;
    }
    .avatar.fallback {
      display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #666; background: #e8e8ee;
    }
    .meta { margin-top: 6px; opacity: 0.7; font-size: 13px; padding-left: 2px; }
    .unlinked {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid rgba(79,61,255,0.15);
      display: flex; flex-direction: column; gap: 8px;
    }
    .unlinkedLabel {
      font-size: 12px; font-weight: 800; opacity: 0.65;
      text-transform: uppercase; letter-spacing: 0.03em;
    }
    .gamesLink { color: #4f3dff; font-weight: 800; font-size: 14px; }
    .actions { display: flex; gap: 8px; flex-shrink: 0; }
  </style>
</head>
<body>
  <div class="topRow">
    <div>
      <h1 class="title">Уведомления</h1>
      <p class="subtitle">Приглашения и ответы по группам</p>
    </div>
  </div>
  <div class="ctaRow">
    <span class="pill purple">Мои рейтинги</span>
    <span class="pill">История одиночных</span>
    <span class="pill blue">Мои матчи</span>
    <span class="pill active">Уведомления</span>
    <span class="pill">Профиль</span>
    <span class="pill green">Мои группы</span>
    <span class="pill pink">Выйти</span>
  </div>
  <div class="card">
    <div class="toolbar">
      <button class="btn secondary">Обновить</button>
      <div class="filterHint">Непрочитанные</div>
    </div>
    <div class="notifRow unread">
      <div>
        <div class="chip">
          <img class="avatar" src="https://i.pravatar.cc/80?u=admin-yuri" alt="" />
          Вупсен Юрий
        </div>
        <div class="meta">testable · Запрос на связывание аккаунта</div>
        <div class="unlinked">
          <div class="unlinkedLabel">Кого связывают</div>
          <div class="chip">
            <span class="avatar fallback">АИ</span>
            Алексей Иванов
          </div>
          <div class="gamesLink">Посмотреть его игры →</div>
        </div>
      </div>
      <div class="actions">
        <button class="btn">Принять</button>
        <button class="btn secondary">Отклонить</button>
      </div>
    </div>
  </div>
</body>
</html>
